[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "our-snd-aeration-control"
version = "0.5.0"
description = "面向污水生化处理的 OUR-SND 数据整理、可信验证与曝气决策工具"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xie176320" }]
keywords = [
  "wastewater-treatment",
  "oxygen-uptake-rate",
  "simultaneous-nitrification-denitrification",
  "machine-learning",
  "aeration-control",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
web = ["streamlit>=1.51,<2"]
dev = [
  "coverage>=7.6",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
snd-control = "wastewater_snd.cli:main"

[project.urls]
Homepage = "https://github.com/xie176320/our-snd-aeration-control"
Repository = "https://github.com/xie176320/our-snd-aeration-control"
Issues = "https://github.com/xie176320/our-snd-aeration-control/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
