name: Mini Program CI

on:
  push:
    branches: [main]
    paths:
      - "miniprogram/**"
      - ".github/workflows/miniprogram-ci.yml"
  pull_request:
    paths:
      - "miniprogram/**"
      - ".github/workflows/miniprogram-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: Install dependencies
        working-directory: miniprogram
        run: npm install --ignore-scripts --package-lock-only

      - name: Validate source and run tests
        working-directory: miniprogram
        run: npm run check
