name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-demo:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[plot,web,dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests streamlit_app.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic end-to-end demo
        if: matrix.python-version == '3.12'
        run: bash scripts/run_demo.sh outputs/ci-demo

      - name: Smoke-test dashboard
        if: matrix.python-version == '3.12'
        env:
          SND_APP_MODE: public
          SND_LOCAL_IMPORT: "0"
        run: |
          streamlit run streamlit_app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 > /tmp/streamlit.log 2>&1 &
          dashboard_pid=$!
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8501/_stcore/health"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("dashboard health check failed")
          PY
          kill "${dashboard_pid}"

      - name: Smoke-test local import mode
        if: matrix.python-version == '3.12'
        env:
          SND_APP_MODE: local
          SND_LOCAL_IMPORT: "1"
        run: |
          streamlit run streamlit_app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8502 > /tmp/streamlit-local.log 2>&1 &
          dashboard_pid=$!
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8502/_stcore/health"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("local dashboard health check failed")
          PY
          kill "${dashboard_pid}"

      - name: Upload demo results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-model-results
          path: outputs/ci-demo
          retention-days: 7
          if-no-files-found: error

  container-build:
    name: Docker build
    needs: test-and-demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build dashboard image
        run: docker build --tag our-snd-aeration-control:ci .
