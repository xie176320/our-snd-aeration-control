services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      SND_APP_MODE: local
      SND_LOCAL_IMPORT: "1"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
